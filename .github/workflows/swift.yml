name: Swift CI & Docs

on:
  push:
    branches: [ main, development ]
  pull_request:
    branches: [ main, development ]

jobs:
  build-and-docs:
    # The package deploys to the OS 26 platforms, so the job needs an Xcode 26 SDK.
    # Xcode 16.x cannot build it.
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Check the toolchain is new enough
        run: |
          # The package deploys to the OS 26 platforms and needs that SDK to build at all.
          # Without this check a too-old image fails later, inside compilation, with errors
          # that do not name the real cause.
          required=26
          major=$(xcodebuild -version | head -1 | sed -E 's/Xcode ([0-9]+).*/\1/')
          if [ "$major" -lt "$required" ]; then
            echo "::error::Xcode $major is too old. This package needs Xcode $required or newer for the OS 26 SDK. Pin a runner image that provides it, or lower the platforms in Package.swift."
            exit 1
          fi
          xcodebuild -version
          swift --version

      - name: Build Package
        run: swift build -v

      - name: Run Tests
        run: swift test -v

      - name: Build for every declared platform
        run: |
          # `swift build` only compiles for the host, so a platform-specific failure never
          # showed up here: the package declared visionOS while calling a StoreKit API that
          # does not exist there, and nothing noticed. Build the library for each platform
          # in Package.swift and fail on the first one that does not compile.
          for destination in \
            "generic/platform=iOS" \
            "generic/platform=macOS,variant=Mac Catalyst" \
            "generic/platform=watchOS" \
            "generic/platform=tvOS" \
            "generic/platform=visionOS"
          do
            echo "::group::$destination"
            if xcodebuild build -scheme RKPurchaseKit -destination "$destination" \
                 -derivedDataPath platform-builds CODE_SIGNING_ALLOWED=NO > platform-build.log 2>&1
            then
              grep -E "warning:" platform-build.log | sort -u || true
              echo "$destination: build succeeded"
              echo "::endgroup::"
            else
              echo "::endgroup::"
              grep -E "error:" platform-build.log | sort -u
              echo "::error::The package does not build for $destination."
              exit 1
            fi
          done

      - name: Generate DocC
        run: |
         mkdir -p docs
         xcodebuild docbuild \
          -scheme RKPurchaseKit \
          -destination 'platform=macOS' \
          -derivedDataPath docs-build

         $(xcrun --find docc) process-archive \
         transform-for-static-hosting docs-build/Build/Products/Debug/RKPurchaseKit.doccarchive \
           --output-path docs \
           --hosting-base-path PurchaseKit

      - name: Add index.html redirect
        run: |
          echo '<!DOCTYPE html><html><head><meta http-equiv="refresh" content="0; url=documentation/rkpurchasekit/"></head><body></body></html>' > docs/index.html
      
      - name: Commit and Push Docs to Main
        if: github.ref == 'refs/heads/main'
        run: |
         git config user.name github-actions
         git config user.email github-actions@github.com
         git add docs
         git commit -m "📚 Update documentation" --allow-empty
         git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} HEAD:main
