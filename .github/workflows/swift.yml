name: Swift CI & Docs

on:
  push:
    branches: [ main, development ]
  pull_request:
    branches: [ main, development ]

# Every job starts from read-only access. Only publish-docs gets write, and only on a push
# to main, so a pull request never runs with a token that can push to the repository.
permissions:
  contents: read

jobs:
  build-and-docs:
    # The package deploys to the OS 26 platforms, so the job needs an Xcode 26 SDK.
    # Xcode 16.x cannot build it.
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode
        # Third-party action pinned to a commit: a tag can be moved to other code, a SHA cannot.
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - name: Check the toolchain is new enough
        run: |
          # The package deploys to the OS 26 platforms and needs that SDK to build at all.
          # Without this check a too-old image fails later, inside compilation, with errors
          # that do not name the real cause.
          required=26
          major=$(xcodebuild -version | head -1 | sed -E 's/Xcode ([0-9]+).*/\1/')
          if [ "$major" -lt "$required" ]; then
            echo "::error::Xcode $major is too old. This package needs Xcode $required or newer for the OS 26 SDK. Pin a runner image that provides it, or lower the platforms in Package.swift."
            exit 1
          fi
          xcodebuild -version
          swift --version

      - name: Build Package
        run: swift build -v

      - name: Run Tests
        run: swift test -v

      - name: Build for every declared platform
        run: |
          # `swift build` only compiles for the host, so a platform-specific failure never
          # showed up here: the package declared visionOS while calling a StoreKit API that
          # does not exist there, and nothing noticed. Build the library for each platform
          # in Package.swift and fail on the first one that does not compile.
          for destination in \
            "generic/platform=iOS" \
            "generic/platform=macOS,variant=Mac Catalyst" \
            "generic/platform=watchOS" \
            "generic/platform=tvOS" \
            "generic/platform=visionOS"
          do
            echo "::group::$destination"
            if xcodebuild build -scheme RKPurchaseKit -destination "$destination" \
                 -derivedDataPath platform-builds CODE_SIGNING_ALLOWED=NO > platform-build.log 2>&1
            then
              grep -E "warning:" platform-build.log | sort -u || true
              echo "$destination: build succeeded"
              echo "::endgroup::"
            else
              echo "::endgroup::"
              grep -E "error:" platform-build.log | sort -u
              echo "::error::The package does not build for $destination."
              exit 1
            fi
          done

      - name: Build the example app
        run: |
          # Examples/PaywallDemo uses the kit only through its public API, as a client would.
          # Building it catches a public API change that breaks clients but not the tests.
          xcodebuild build -project Examples/PaywallDemo/PaywallDemo.xcodeproj -scheme PaywallDemo -destination generic/platform=iOS\ Simulator CODE_SIGNING_ALLOWED=NO

      - name: Generate DocC
        run: |
         mkdir -p docs
         xcodebuild docbuild \
          -scheme RKPurchaseKit \
          -destination 'platform=macOS' \
          -derivedDataPath docs-build

         $(xcrun --find docc) process-archive \
         transform-for-static-hosting docs-build/Build/Products/Debug/RKPurchaseKit.doccarchive \
           --output-path docs \
           --hosting-base-path PurchaseKit

      - name: Add index.html redirect
        run: |
          echo '<!DOCTYPE html><html><head><meta http-equiv="refresh" content="0; url=documentation/rkpurchasekit/"></head><body></body></html>' > docs/index.html
      
      - name: Pack documentation
        # DocC names a method's page after its signature, e.g. "init(productid:type:...)", and
        # upload-artifact rejects colons in file names (an NTFS limit it applies everywhere).
        # A single tar file carries those names through untouched. Without extended
        # attributes: macOS tar stores them by default, and restoring them fails on the
        # longest of these names when the archive is unpacked.
        run: COPYFILE_DISABLE=1 tar --no-xattrs --no-mac-metadata -cf docs.tar docs

      - name: Upload documentation
        # Uploaded on every run, so a pull request exercises this half of the hand-off too.
        uses: actions/upload-artifact@v7
        with:
          name: docs
          path: docs.tar
          retention-days: 1

  publish-docs:
    # Split out of the build so that write access exists only here: this job runs only for a
    # push to main and does nothing but commit the documentation the build produced.
    needs: build-and-docs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download documentation
        uses: actions/download-artifact@v8
        with:
          name: docs
          path: artifact

      - name: Commit and Push Docs to Main
        run: |
          # Replace the folder rather than copying over it, so pages that no longer exist are
          # removed instead of lingering on the site.
          rm -rf docs
          tar -xf artifact/docs.tar
          rm -rf artifact
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add docs
          git commit -m "📚 Update documentation" --allow-empty
          git push origin HEAD:main
